name: China Options Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine.py"
      - "eod_enrich.py"
      - "futures_link.py"
      - "radar_history.py"
      - "backfill_cffex.py"
      - "tests/**"
      - "README.md"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    # 17:00 Asia/Shanghai = 09:00 UTC, Monday-Friday.
    # CFFEX official EOD validates the trading day. On China holidays/non-trading
    # days the enrichment step preserves the latest verified snapshot.
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: china-options-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect option chains and calculate IV/Greeks
        env:
          RISK_FREE_RATE: "0.015"
          # Volume/OI now come from CFFEX official EOD in one request; disable
          # the older per-contract Sina dayline crawl to reduce runtime/failures.
          MAX_VOLUME_CONTRACTS_PER_PRODUCT: "0"
        run: python engine.py

      - name: Enrich with CFFEX official EOD option volume/OI
        run: python eod_enrich.py

      - name: Link IH IF IC IM futures with HO IO MO option metrics
        run: python futures_link.py

      - name: Update compact radar history
        run: python radar_history.py

      - name: Validate compact radar history
        run: python radar_history.py --check

      - name: Commit data snapshot
        run: |
          git config user.name "china-options-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update China options snapshot"
            git push
          fi
