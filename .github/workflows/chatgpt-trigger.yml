name: ChatGPT Scheduler Bridge

on:
  push:
    branches: [main]
    paths:
      - "automation/chatgpt-trigger.txt"
  issues:
    types: [edited]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'push' || github.event.issue.number == 5 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production daily workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main --repo "$GITHUB_REPOSITORY"
